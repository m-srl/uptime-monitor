# Upptime config — see https://upptime.js.org/docs/configuration

owner: m-srl    # ← schimbă cu username-ul tău GitHub
repo: uptime-monitor                # ← ex: uptime-monitor
user-agent: Upptime-Pegasus-Monitor

# Endpoint-urile monitorizate
sites:
  - name: Pegasus
    url: https://pegasusit.ro
    expectedStatusCodes:
      - 200
  - name: Pegasus - Health
    url: https://status.pegasusit.ro/health
    headers:
      - X-Health-Token: $HEALTH_TOKEN
    expectedStatusCodes:
      - 200
    maxResponseTime: 1000  
  - name: Pegasus - Proprietati
    url: https://pegasusit.ro/proprietati
    expectedStatusCodes:
      - 200

# Status page settings
status-website:
  cname: ""                    # gol = folosește github.io URL-ul default
  baseUrl: /uptime-monitor
  name: Uptime Status
  introTitle: "Status checks"
  introMessage: "Monitorizare automata a serviciilor."
  logoUrl: ""

# Notification config (vom completa secrets în pas 3)
notifications:
  - type: telegram
    botToken: $NOTIFICATION_TELEGRAM_BOT_KEY
    chatId: $NOTIFICATION_TELEGRAM_CHAT_ID

# Comportament
commitMessages:
  readmeContent: ":pencil: Update summary in README [skip ci]"
  summaryJson: ":card_file_box: Update status summary [skip ci]"
  statusChange: "$EMOJI $SITE_NAME is $STATUS ($RESPONSE_CODE in $RESPONSE_TIME ms) [skip ci]"
  graphsUpdate: ":bar_chart: Update graphs [skip ci]"
  readmeBuild: ":robot: Built README [skip ci]"

# Misc
i18n:
  activeIncidents: Incidente active
  allSystemsOperational: Toate serviciile functioneaza
  incidentReportOn: Raport incident pe
  incident: Incident
  scheduledMaintenance: Mentenanta programata
  status: Status
  upptime: Generat de Upptime
  responseTime: Timp raspuns
  uptime: Uptime
  hours: ore
  days: zile
  months: luni
  years: ani
  ago: in urma
